plugins {
    id 'com.android.application'
}

android {
    namespace 'com.enterprises.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.enterprises.dashboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.4.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
